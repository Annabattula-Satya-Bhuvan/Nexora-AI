<template id="nxAgentCardTemplate">
  <article class="nx-agent-card" data-agent-card>
    <div class="nx-card-top">
      <div class="nx-agent-icon" data-agent-icon>🤖</div>
      <span class="nx-agent-status" data-agent-status>AVAILABLE</span>
    </div>

    <h3 data-agent-name>Agent Name</h3>
    <p class="nx-agent-role" data-agent-role>Agent Specialization</p>
    <p class="nx-agent-description" data-agent-description>
      Agent description goes here.
    </p>

    <div class="nx-agent-capabilities" data-agent-capabilities></div>

    <div class="nx-card-footer">
      <span>NEXORA SPECIALIST</span>
      <button type="button" data-agent-action>View Agent ↗</button>
    </div>
  </article>
</template>
