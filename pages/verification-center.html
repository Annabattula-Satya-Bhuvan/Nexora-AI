<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA | Verification Center</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b16;color:#eef0ff;font-family:Arial,sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:#101326;padding:25px 17px;border-right:1px solid #252943;flex-shrink:0}
.logo{font-size:21px;font-weight:bold;color:#a78bfa;margin-bottom:35px}nav a{display:block;color:#aeb4d0;text-decoration:none;padding:11px;border-radius:9px;margin:4px 0;font-size:13px}nav a:hover,nav a.active{background:#28234a;color:white}
main{padding:35px;width:100%;max-width:1250px;margin:auto}h1{margin:0 0 8px}.muted{color:#9299b8;font-size:13px}
.card{background:#12162a;border:1px solid #292e4d;border-radius:14px;padding:20px;margin-top:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat strong{display:block;font-size:27px;color:#a78bfa;margin-top:10px}
input,textarea,select{background:#0b0e1d;color:white;border:1px solid #303653;border-radius:8px;padding:11px;margin:5px 5px 5px 0}textarea{width:100%;min-height:75px}
button{background:linear-gradient(120deg,#6655df,#9333ea);color:white;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;margin:3px}
.item{border-bottom:1px solid #292e4d;padding:17px 0}.item:last-child{border:0}
.pill{background:#25284a;padding:5px 9px;border-radius:20px;font-size:11px}
@media(max-width:750px){aside{width:65px;padding:15px 5px}aside .logo{font-size:12px}nav a{font-size:0}main{padding:18px}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside><div class="logo">✦ NEXORA</div><nav>
<a href="../index.html">Dashboard</a><a href="missions.html">Missions</a><a href="task-manager.html">Task Manager</a><a href="projects.html">Projects</a><a href="workflow-studio.html">Workflow Studio</a><a href="war-room.html">AI War Room</a><a href="verification-center.html" class="active">Verification</a><a href="user-management.html">User Management</a><a href="security.html">Security</a>
</nav></aside>
<main>
<h1>Verification Center</h1>
<p class="muted">Review facts, sources, code and deliverables before approval.</p>
<div class="stats">
<div class="card stat">Total Reviews<strong id="total">0</strong></div>
<div class="card stat">Pending<strong id="pending">0</strong></div>
<div class="card stat">Approved<strong id="approved">0</strong></div>
</div>
<div class="card">
<h3>Submit for Verification</h3>
<input id="title" placeholder="Deliverable or claim title" style="width:65%">
<select id="type"><option>Fact Check</option><option>Source Review</option><option>Code Review</option><option>Deliverable Review</option></select>
<textarea id="details" placeholder="Describe what needs to be checked. Include source links or relevant details."></textarea>
<button onclick="add()">Submit Review</button>
</div>
<div class="card">
<h3>Verification Queue</h3>
<select id="filter" onchange="render()"><option>All</option><option>Pending</option><option>Approved</option><option>Rejected</option></select>
<div id="list"></div>
</div>
</main>
<script>
const key="nexoraVerifications";
let items=JSON.parse(localStorage.getItem(key)||"null")||[
{id:1,title:"Sample research claim",type:"Fact Check",details:"Verify the accuracy of a research statement and its supporting evidence.",status:"Pending",score:"",note:""},
{id:2,title:"Sample project deliverable",type:"Deliverable Review",details:"Review completeness and quality before approval.",status:"Approved",score:92,note:"Meets the review criteria."}
];
function save(){localStorage.setItem(key,JSON.stringify(items));render()}
function add(){
let title=document.getElementById("title").value.trim(),details=document.getElementById("details").value.trim();
if(!title||!details)return alert("Enter a title and review details.");
items.unshift({id:Date.now(),title,type:document.getElementById("type").value,details,status:"Pending",score:"",note:""});
document.getElementById("title").value="";document.getElementById("details").value="";save();
}
function review(id,status){
let score=prompt("Enter quality score from 0 to 100:");
if(score===null)return;
if(score.trim()===""||Number(score)<0||Number(score)>100||!Number.isFinite(Number(score)))return alert("Enter a score from 0 to 100.");
let note=prompt("Reviewer notes (optional):")||"";
items=items.map(x=>x.id===id?{...x,status,score:Number(score),note}:x);save();
}
function removeItem(id){if(confirm("Delete this review?")){items=items.filter(x=>x.id!==id);save()}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
document.getElementById("total").textContent=items.length;
document.getElementById("pending").textContent=items.filter(x=>x.status==="Pending").length;
document.getElementById("approved").textContent=items.filter(x=>x.status==="Approved").length;
let f=document.getElementById("filter").value;
document.getElementById("list").innerHTML=items.filter(x=>f==="All"||x.status===f).map(x=>`<div class="item"><strong>${esc(x.title)}</strong> <span class="pill">${esc(x.status)}</span><p class="muted">${esc(x.type)} · ${esc(x.details)}</p>${x.score!==""?`<p>Quality score: <b>${x.score}/100</b></p>`:""}${x.note?`<p class="muted">Reviewer note: ${esc(x.note)}</p>`:""}${x.status==="Pending"?`<button onclick="review(${x.id,'Approved'})">Approve</button><button onclick="review(${x.id,'Rejected'})">Reject</button>`:""}<button onclick="removeItem(${x.id})" style="background:#702d48">Delete</button></div>`).join("")||'<p class="muted">No reviews found.</p>';
}
render();
</script>
</body>
</html>
