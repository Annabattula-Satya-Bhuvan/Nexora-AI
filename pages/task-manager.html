<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI — Task Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#080b14;color:#edf1ff;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;background:#0d1220;border-right:1px solid #202942;padding:26px 16px;flex-shrink:0}
.logo{font-size:23px;font-weight:800;color:#8b9cff;margin:0 10px 35px}
.logo span{color:white}
.nav a{display:block;color:#929db8;text-decoration:none;padding:12px 14px;border-radius:9px;margin:5px 0;font-size:14px}
.nav a:hover,.nav a.active{background:#192344;color:#9eafff}
main{flex:1;padding:38px;min-width:0}
.header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:30px;margin-bottom:8px}
.subtitle{color:#8994ae;font-size:14px}
button,input,select{font:inherit;border-radius:8px}
button{background:#5268e8;color:white;border:0;padding:11px 16px;cursor:pointer}
button:hover{background:#687df5}
input,select{background:#101729;border:1px solid #293754;color:white;padding:11px 13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:24px}
.stat,.panel,.task{background:#101729;border:1px solid #202d49;border-radius:13px;padding:19px}
.stat small{color:#8d9ab6}
.stat strong{display:block;font-size:27px;margin-top:10px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar input{flex:1;min-width:180px}
.task{margin-bottom:12px}
.task-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.task h3{font-size:16px;margin-bottom:8px}
.meta{font-size:13px;color:#8995b0;line-height:1.8}
.status{font-size:11px;padding:6px 10px;border-radius:20px;background:#202b48;color:#b4c2ff;height:max-content}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions button{font-size:12px;padding:7px 10px;background:#1b2949;border:1px solid #344568}
.actions button.delete{background:#39202d;border-color:#613044}
.empty{text-align:center;color:#8995ae;padding:35px}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px;z-index:5}
.modal-box{width:100%;max-width:440px;background:#111a2e;border:1px solid #304064;border-radius:15px;padding:24px}
.modal-box h2{margin-bottom:18px}
.modal-box input,.modal-box select{width:100%;margin:7px 0 14px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.secondary{background:#26324c}
@media(max-width:750px){.sidebar{width:65px;padding:20px 7px}.logo{font-size:0;margin:0 0 25px}.logo:after{content:"N";font-size:22px}.nav a{font-size:0;text-align:center}.nav a:first-letter{font-size:17px}main{padding:22px 14px}.stats{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">NEXORA<span> AI</span></div>
<nav class="nav">
<a href="../index.html">⌂ Home</a>
<a href="dashboard.html">▦ Dashboard</a>
<a href="command-center.html">⌘ Command Center</a>
<a href="workforce.html">♟ Workforce</a>
<a href="agent-studio.html">✧ Agent Studio</a>
<a href="agent-marketplace.html">▤ Marketplace</a>
<a href="missions.html">◎ Missions</a>
<a class="active" href="task-manager.html">☷ Task Manager</a>
<a href="projects.html">▣ Projects</a>
<a href="workflow-studio.html">◇ Workflow Studio</a>
</nav>
</aside>

<main>
<div class="header">
<div>
<h1>Task Manager</h1>
<p class="subtitle">Organize, prioritize and track your work.</p>
</div>
<button onclick="openModal()">+ New Task</button>
</div>

<section class="stats">
<div class="stat"><small>Total Tasks</small><strong id="total">0</strong></div>
<div class="stat"><small>In Progress</small><strong id="progress">0</strong></div>
<div class="stat"><small>Completed</small><strong id="completed">0</strong></div>
</section>

<div class="toolbar">
<input id="search" placeholder="Search tasks..." oninput="render()">
<select id="filter" onchange="render()">
<option value="all">All Tasks</option>
<option value="Pending">Pending</option>
<option value="In Progress">In Progress</option>
<option value="Completed">Completed</option>
</select>
</div>

<section id="taskList"></section>
</main>
</div>

<div class="modal" id="modal">
<div class="modal-box">
<h2>Create a Task</h2>
<form id="taskForm">
<label>Task title</label>
<input id="taskTitle" required maxlength="120" placeholder="Enter task title">
<label>Priority</label>
<select id="taskPriority">
<option>Normal</option><option>High</option><option>Urgent</option><option>Low</option>
</select>
<label>Due date</label>
<input id="taskDate" type="date">
<div class="modal-actions">
<button type="button" class="secondary" onclick="closeModal()">Cancel</button>
<button type="submit">Save Task</button>
</div>
</form>
</div>
</div>

<script>
const KEY="nexoraTasks";

function getTasks(){
  try{return JSON.parse(localStorage.getItem(KEY))||[]}
  catch{return []}
}
function saveTasks(tasks){
  localStorage.setItem(KEY,JSON.stringify(tasks));
}
function openModal(){
  document.getElementById("modal").style.display="flex";
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}
document.getElementById("taskForm").addEventListener("submit",function(e){
  e.preventDefault();
  const tasks=getTasks();
  tasks.unshift({
    title:document.getElementById("taskTitle").value.trim(),
    priority:document.getElementById("taskPriority").value,
    dueDate:document.getElementById("taskDate").value,
    status:"Pending",
    created:new Date().toLocaleDateString()
  });
  saveTasks(tasks);
  this.reset();
  closeModal();
  render();
});
function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function updateTask(index,status){
  const tasks=getTasks();
  if(!tasks[index])return;
  tasks[index].status=status;
  saveTasks(tasks);
  render();
}
function deleteTask(index){
  if(!confirm("Delete this task?"))return;
  const tasks=getTasks();
  tasks.splice(index,1);
  saveTasks(tasks);
  render();
}
function render(){
  const tasks=getTasks();
  const search=document.getElementById("search").value.toLowerCase();
  const filter=document.getElementById("filter").value;

  document.getElementById("total").textContent=tasks.length;
  document.getElementById("progress").textContent=tasks.filter(t=>t.status==="In Progress").length;
  document.getElementById("completed").textContent=tasks.filter(t=>t.status==="Completed").length;

  const filtered=tasks.map((task,index)=>({...task,index})).filter(t=>
    t.title.toLowerCase().includes(search)&&
    (filter==="all"||t.status===filter)
  );

  const list=document.getElementById("taskList");
  if(!filtered.length){
    list.innerHTML='<div class="panel empty">No tasks found. Create your first task.</div>';
    return;
  }

  list.innerHTML=filtered.map(t=>`
    <article class="task">
      <div class="task-top">
        <div>
          <h3>${escapeHTML(t.title)}</h3>
          <div class="meta">
            Priority: ${escapeHTML(t.priority)}<br>
            Due: ${escapeHTML(t.dueDate||"Not set")}<br>
            Created: ${escapeHTML(t.created||"")}
          </div>
        </div>
        <span class="status">${escapeHTML(t.status)}</span>
      </div>
      <div class="actions">
        <button onclick="updateTask(${t.index},'In Progress')">Start</button>
        <button onclick="updateTask(${t.index},'Completed')">Complete</button>
        <button onclick="updateTask(${t.index},'Pending')">Reset</button>
        <button class="delete" onclick="deleteTask(${t.index})">Delete</button>
      </div>
    </article>
  `).join("");
}
render();
</script>
</body>
</html>
