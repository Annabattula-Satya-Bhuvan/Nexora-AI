<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI | Task Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#080d1b;color:#eef2ff;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:245px;background:#0d1528;border-right:1px solid #202c46;padding:28px 17px;flex-shrink:0}
.logo{font-size:22px;font-weight:800;margin-bottom:38px;color:#fff}
.logo span{color:#8b7cff}
.nav-label{font-size:10px;letter-spacing:2px;color:#697895;margin:22px 10px 10px}
.nav a{display:block;text-decoration:none;color:#9eabc5;padding:12px;border-radius:9px;font-size:13px;margin:4px 0}
.nav a:hover,.nav a.active{background:#202b49;color:#fff}
main{flex:1;padding:38px;min-width:0}
.header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px;flex-wrap:wrap}
h1{font-size:30px}
.subtitle{color:#8997b4;font-size:14px;margin-top:8px}
button{border:0;border-radius:8px;padding:10px 14px;background:#7164ed;color:white;font-weight:700;cursor:pointer}
button:hover{background:#887cff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
.stat,.task{background:#101a30;border:1px solid #24314e;border-radius:13px;padding:19px}
.stat small{color:#91a0bd}
.stat strong{display:block;font-size:28px;margin-top:9px}
.toolbar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
input,select,textarea{background:#101a30;border:1px solid #2b3a5a;color:white;border-radius:8px;padding:12px;width:100%;font:inherit}
.toolbar input{flex:1;min-width:180px}
.toolbar select{width:auto;min-width:150px}
.task{margin-bottom:13px}
.task-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.task h3{font-size:16px}
.task p{font-size:13px;color:#94a1bb;line-height:1.6;margin-top:9px}
.status,.priority{font-size:11px;padding:6px 10px;border-radius:20px;background:#27344e;color:#c4d2f4}
.status.progress{background:#253b62;color:#9dc5ff}
.status.completed{background:#173e37;color:#83e4c2}
.status.pending{background:#47371f;color:#f4cb85}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.actions button{font-size:11px;padding:8px 11px;background:#263654}
.actions button.delete{background:#472535}
.empty{text-align:center;color:#8997b4;padding:45px 15px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal-box{width:100%;max-width:460px;background:#111a2e;border:1px solid #304064;border-radius:15px;padding:24px}
.modal-box h2{margin-bottom:18px}
.modal-box label{display:block;font-size:12px;color:#aebbd3;margin:14px 0 7px}
.modal-box textarea{min-height:85px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.secondary{background:#26324c}
@media(max-width:750px){
.sidebar{width:65px;padding:20px 7px}
.logo{font-size:0;margin-bottom:25px}
.logo:after{content:"N";font-size:22px}
.nav-label{display:none}
.nav a{font-size:0;text-align:center;padding:13px 5px}
.nav a:first-letter{font-size:17px}
main{padding:22px 14px}
.stats{grid-template-columns:1fr}
h1{font-size:25px}
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">NEXORA<span> AI</span></div>
<nav class="nav">
<a href="../index.html">⌂ Home</a>
<a href="dashboard.html">▦ Dashboard</a>
<a href="command-center.html">⌘ Command Center</a>
<a href="workforce.html">♟ Workforce</a>
<a href="agent-studio.html">✧ Agent Studio</a>
<a href="agent-marketplace.html">▤ Marketplace</a>
<a href="missions.html">◎ Missions</a>
<a class="active" href="task-manager.html">☷ Task Manager</a>
<a href="projects.html">▣ Projects</a>
<a href="workflow-studio.html">◇ Workflow Studio</a>
</nav>
</aside>

<main>
<div class="header">
<div>
<h1>Task Manager</h1>
<p class="subtitle">Organize, prioritize and track your work.</p>
</div>
<button onclick="openModal()">+ New Task</button>
</div>

<section class="stats">
<div class="stat"><small>Total Tasks</small><strong id="total">0</strong></div>
<div class="stat"><small>In Progress</small><strong id="progress">0</strong></div>
<div class="stat"><small>Completed</small><strong id="completed">0</strong></div>
</section>

<div class="toolbar">
<input id="search" placeholder="Search tasks..." oninput="render()">
<select id="filter" onchange="render()">
<option value="all">All Tasks</option>
<option value="Pending">Pending</option>
<option value="In Progress">In Progress</option>
<option value="Completed">Completed</option>
</select>
</div>

<section id="taskList"></section>
</main>
</div>

<div class="modal" id="taskModal">
<div class="modal-box">
<h2>Create New Task</h2>
<form id="taskForm">
<label for="taskTitle">Task Title</label>
<input id="taskTitle" maxlength="100" placeholder="Enter task title" required>

<label for="taskDescription">Description</label>
<textarea id="taskDescription" maxlength="500" placeholder="Describe this task"></textarea>

<label for="taskPriority">Priority</label>
<select id="taskPriority">
<option>Normal</option>
<option>High</option>
<option>Urgent</option>
<option>Low</option>
</select>

<div class="modal-actions">
<button type="button" class="secondary" onclick="closeModal()">Cancel</button>
<button type="submit">Create Task</button>
</div>
</form>
</div>
</div>

<script>
const STORAGE_KEY = "nexoraTasks";

function getTasks(){
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveTasks(tasks){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}

function openModal(){
  document.getElementById("taskModal").classList.add("open");
  document.getElementById("taskTitle").focus();
}

function closeModal(){
  document.getElementById("taskModal").classList.remove("open");
}

document.getElementById("taskForm").addEventListener("submit", function(e){
  e.preventDefault();

  const title = document.getElementById("taskTitle").value.trim();
  const description = document.getElementById("taskDescription").value.trim();
  const priority = document.getElementById("taskPriority").value;

  if(!title) return;

  const tasks = getTasks();

  tasks.unshift({
    id: Date.now().toString(),
    title,
    description,
    priority,
    status: "Pending",
    created: new Date().toLocaleString()
  });

  saveTasks(tasks);
  this.reset();
  closeModal();
  render();
});

function updateTask(id, status){
  const tasks = getTasks().map(task =>
    String(task.id) === String(id) ? {...task, status} : task
  );

  saveTasks(tasks);
  render();
}

function deleteTask(id){
  if(!confirm("Delete this task?")) return;

  saveTasks(getTasks().filter(task =>
    String(task.id) !== String(id)
  ));

  render();
}

function render(){
  const tasks = getTasks();
  const search = document.getElementById("search").value.toLowerCase();
  const filter = document.getElementById("filter").value;

  document.getElementById("total").textContent = tasks.length;
  document.getElementById("progress").textContent =
    tasks.filter(t => t.status === "In Progress").length;
  document.getElementById("completed").textContent =
    tasks.filter(t => t.status === "Completed").length;

  const filtered = tasks.filter(task => {
    const matchesSearch =
      (task.title || "").toLowerCase().includes(search) ||
      (task.description || "").toLowerCase().includes(search);

    const matchesFilter =
      filter === "all" || task.status === filter;

    return matchesSearch && matchesFilter;
  });

  const list = document.getElementById("taskList");
  list.replaceChildren();

  if(!filtered.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = tasks.length
      ? "No tasks match your search."
      : "No tasks yet. Create your first task.";
    list.append(empty);
    return;
  }

  filtered.forEach(task => {
    const card = document.createElement("article");
    card.className = "task";

    const top = document.createElement("div");
    top.className = "task-top";

    const title = document.createElement("h3");
    title.textContent = task.title;

    const status = document.createElement("span");
    status.className = "status " +
      (task.status === "Completed" ? "completed" :
      task.status === "In Progress" ? "progress" : "pending");
    status.textContent = task.status;

    top.append(title, status);

    const description = document.createElement("p");
    description.textContent = task.description || "No description provided.";

    const details = document.createElement("p");
    details.textContent = "Priority: " + task.priority + " · Created: " + task.created;

    const actions = document.createElement("div");
    actions.className = "actions";

    const nextStatus =
      task.status === "Pending" ? "In Progress" :
      task.status === "In Progress" ? "Completed" : "Pending";

    const updateButton = document.createElement("button");
    updateButton.textContent = "Mark " + nextStatus;
    updateButton.addEventListener("click", () => updateTask(task.id, nextStatus));

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "Delete";
    deleteButton.addEventListener("click", () => deleteTask(task.id));

    actions.append(updateButton, deleteButton);
    card.append(top, description, details, actions);
    list.append(card);
  });
}

document.getElementById("taskModal").addEventListener("click", function(e){
  if(e.target === this) closeModal();
});

render();
</script>
</body>
</html>
