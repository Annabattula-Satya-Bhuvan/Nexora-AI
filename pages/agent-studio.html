<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI | Agent Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b14;color:#eef2ff;font-family:Arial,sans-serif}
header{padding:22px 7%;border-bottom:1px solid #202944;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:22px;font-weight:bold;color:#65aaff}
a{color:#8ebcff;text-decoration:none}
main{max-width:1100px;margin:45px auto;padding:0 22px}
h1{font-size:34px;margin-bottom:8px}
.sub{color:#8995ae;margin-bottom:30px}
.panel,.agent{background:#101729;border:1px solid #243451;border-radius:14px;padding:24px}
.panel{max-width:650px;margin-bottom:35px}
label{display:block;margin:17px 0 8px;color:#b8c6df}
input,textarea,select{width:100%;padding:13px;background:#080f20;border:1px solid #30415f;border-radius:8px;color:white;font-size:15px}
textarea{min-height:90px;resize:vertical}
button{padding:12px 18px;border:0;border-radius:8px;background:linear-gradient(90deg,#287cff,#7657ff);color:white;font-weight:bold;cursor:pointer}
button:hover{opacity:.88}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.agent h3{margin:8px 0}
.agent p{color:#9eabc4;line-height:1.5}
.agent small{color:#68dba8}
.delete{background:#542b3b;margin-top:14px}
.notice{color:#8c9bb5;font-size:13px;margin-top:18px}
</style>
</head>
<body>
<header>
<div class="logo">NEXORA AI</div>
<a href="../index.html">← Back to Home</a>
</header>

<main>
<h1>Agent Studio</h1>
<p class="sub">Design, configure and manage your AI workforce.</p>

<section class="panel">
<h2>Create a New Agent</h2>

<form id="agentForm">
<label for="name">Agent Name</label>
<input id="name" placeholder="e.g. Research Assistant" required>

<label for="role">Agent Role</label>
<select id="role" required>
<option value="">Choose a role</option>
<option>Research</option>
<option>Marketing</option>
<option>Development</option>
<option>Operations</option>
<option>Finance</option>
<option>Customer Support</option>
<option>Custom</option>
</select>

<label for="icon">Agent Icon (emoji)</label>
<input id="icon" value="🤖" maxlength="4">

<label for="description">Agent Description</label>
<textarea id="description" placeholder="What should this agent help with?" required></textarea>

<button type="submit">+ Create Agent</button>
</form>
<p class="notice">Agents are saved in this browser and shared with the Workforce page on this device.</p>
</section>

<h2>Your Custom Agents</h2>
<div class="grid" id="agents"></div>
</main>

<script>
const STORAGE_KEY = "nexoraWorkforce";

function getAgents(){
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveAgents(agents){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(agents));
}

function renderAgents(){
  const agents = getAgents().filter(agent => agent.custom);
  const container = document.getElementById("agents");

  if(!agents.length){
    container.innerHTML = '<p class="sub">No custom agents yet. Create your first agent above.</p>';
    return;
  }

  container.innerHTML = agents.map(agent => `
    <article class="agent">
      <div style="font-size:30px">${escapeHTML(agent.icon || "🤖")}</div>
      <h3>${escapeHTML(agent.name)}</h3>
      <small>${escapeHTML(agent.role)}</small>
      <p>${escapeHTML(agent.description)}</p>
      <button class="delete" data-delete="${escapeHTML(agent.id)}">Delete Agent</button>
    </article>
  `).join("");
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

document.getElementById("agentForm").addEventListener("submit", function(event){
  event.preventDefault();

  const agents = getAgents();
  const agent = {
    id: "agent-" + Date.now(),
    name: document.getElementById("name").value.trim(),
    role: document.getElementById("role").value,
    icon: document.getElementById("icon").value.trim() || "🤖",
    description: document.getElementById("description").value.trim(),
    status: "Active",
    custom: true
  };

  agents.push(agent);
  saveAgents(agents);
  this.reset();
  document.getElementById("icon").value = "🤖";
  renderAgents();
});

document.getElementById("agents").addEventListener("click", function(event){
  const id = event.target.dataset.delete;
  if(!id) return;

  const updated = getAgents().filter(agent => agent.id !== id);
  saveAgents(updated);
  renderAgents();
});

renderAgents();
</script>
</body>
</html>
