<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA | Workflow Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b16;color:#eef0ff;font-family:Arial,sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:#101326;padding:25px 17px;border-right:1px solid #252943;flex-shrink:0}
.logo{font-size:21px;font-weight:bold;color:#a78bfa;margin-bottom:35px}nav a{display:block;color:#aeb4d0;text-decoration:none;padding:11px;border-radius:9px;margin:4px 0;font-size:13px}nav a:hover,nav a.active{background:#28234a;color:white}
main{padding:35px;width:100%;max-width:1250px;margin:auto}h1{margin:0 0 8px}.muted{color:#9299b8;font-size:13px}
.card{background:#12162a;border:1px solid #292e4d;border-radius:14px;padding:20px;margin-top:20px}
input,textarea,select{background:#0b0e1d;color:white;border:1px solid #303653;border-radius:8px;padding:11px;margin:5px 5px 5px 0}
button{background:linear-gradient(120deg,#6655df,#9333ea);color:white;border:0;padding:10px 14px;border-radius:8px;cursor:pointer;margin:3px}
button.danger{background:#702d48}button.secondary{background:#303653}
.workflow{background:#0d1122;border:1px solid #292e4d;border-radius:12px;padding:17px;margin:12px 0}
.step{padding:11px;background:#171c35;border-left:3px solid #8b5cf6;margin:8px 0;border-radius:6px}
.pill{background:#25284a;padding:5px 9px;border-radius:20px;font-size:11px}
@media(max-width:750px){aside{width:65px;padding:15px 5px}aside .logo{font-size:12px}nav a{font-size:0}main{padding:18px}}
</style>
</head>
<body>
<aside><div class="logo">✦ NEXORA</div><nav>
<a href="../index.html">Dashboard</a><a href="missions.html">Missions</a><a href="task-manager.html">Task Manager</a><a href="projects.html">Projects</a><a href="workflow-studio.html" class="active">Workflow Studio</a><a href="war-room.html">AI War Room</a><a href="verification-center.html">Verification</a><a href="user-management.html">User Management</a><a href="security.html">Security</a>
</nav></aside>
<main>
<h1>Workflow Studio</h1>
<p class="muted">Design reusable workflows by arranging tasks and assigning specialist agents.</p>
<div class="card">
<h3>Create Workflow</h3>
<input id="name" placeholder="Workflow name" style="width:65%">
<input id="description" placeholder="Workflow description" style="width:100%">
<h3>Build Workflow Steps</h3>
<div id="steps"></div>
<select id="agent"><option>Research Agent</option><option>Planning Agent</option><option>Coding Agent</option><option>Design Agent</option><option>Fact-checking Agent</option></select>
<input id="task" placeholder="Describe this step">
<button onclick="addStep()">+ Add Step</button>
<br><br><button onclick="createWorkflow()">Save Workflow</button>
</div>
<div class="card">
<h3>Saved Workflows</h3>
<div id="workflows"></div>
</div>
</main>
<script>
const key="nexoraWorkflows";
let workflows=JSON.parse(localStorage.getItem(key)||"null")||[];
let steps=[];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function addStep(){
let task=document.getElementById("task").value.trim();
if(!task)return alert("Describe the workflow step.");
steps.push({agent:document.getElementById("agent").value,task});
document.getElementById("task").value="";renderSteps();
}
function renderSteps(){
document.getElementById("steps").innerHTML=steps.map((s,i)=>`<div class="step"><b>${i+1}. ${esc(s.agent)}</b><br>${esc(s.task)} <button class="danger" onclick="removeStep(${i})">Remove</button></div>`).join("")||'<p class="muted">No steps added yet.</p>';
}
function removeStep(i){steps.splice(i,1);renderSteps()}
function createWorkflow(){
let name=document.getElementById("name").value.trim(),description=document.getElementById("description").value.trim();
if(!name||steps.length===0)return alert("Enter a workflow name and add at least one step.");
workflows.unshift({id:Date.now(),name,description,steps:[...steps],active:false,created:new Date().toISOString()});
steps=[];document.getElementById("name").value="";document.getElementById("description").value="";renderSteps();save();
}
function toggle(id){workflows=workflows.map(w=>w.id===id?{...w,active:!w.active}:w);save()}
function removeWorkflow(id){if(confirm("Delete this workflow?")){workflows=workflows.filter(w=>w.id!==id);save()}}
function save(){localStorage.setItem(key,JSON.stringify(workflows));render()}
function render(){
document.getElementById("workflows").innerHTML=workflows.map(w=>`<div class="workflow"><h3>${esc(w.name)} <span class="pill">${w.active?"Active":"Inactive"}</span></h3><p class="muted">${esc(w.description||"No description")}</p><p>${w.steps.length} workflow steps</p>${w.steps.map((s,i)=>`<div class="step">${i+1}. <b>${esc(s.agent)}</b><br>${esc(s.task)}</div>`).join("")}<button onclick="toggle(${w.id})">${w.active?"Deactivate":"Activate"}</button><button class="danger" onclick="removeWorkflow(${w.id})">Delete</button></div>`).join("")||'<p class="muted">No workflows created yet.</p>';
}
renderSteps();render();
</script>
</body>
</html>
