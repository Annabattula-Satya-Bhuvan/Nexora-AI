<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI — Missions</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#080b14;color:#edf1ff;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:230px;background:#0d1220;border-right:1px solid #202942;padding:26px 16px;flex-shrink:0}
.logo{font-size:23px;font-weight:800;color:#8b9cff;margin:0 10px 35px}
.logo span{color:#fff}
.nav a{display:block;color:#929db8;text-decoration:none;padding:12px 14px;border-radius:9px;margin:5px 0;font-size:14px}
.nav a:hover,.nav a.active{background:#192344;color:#9eafff}
main{flex:1;padding:38px;min-width:0}
.header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:30px;margin-bottom:8px}
.subtitle{color:#8994ae;font-size:14px}
button,select{background:#17213b;color:#eaf0ff;border:1px solid #303e61;border-radius:8px;padding:10px 14px;cursor:pointer}
button:hover{border-color:#8295ff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
.stat,.panel{background:#101729;border:1px solid #202d49;border-radius:13px;padding:20px}
.stat small{color:#8d9ab6}
.stat strong{display:block;font-size:27px;margin-top:10px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar input{flex:1;min-width:180px;background:#101729;border:1px solid #293754;color:white;padding:11px 13px;border-radius:8px}
.mission{background:#101729;border:1px solid #202d49;border-radius:12px;padding:19px;margin-bottom:13px}
.mission-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mission h3{font-size:16px;margin-bottom:9px}
.meta{color:#8995b0;font-size:13px;line-height:1.8}
.status{font-size:11px;padding:5px 9px;border-radius:20px;background:#202b48;color:#a9b8ff;height:max-content}
.actions{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.actions button{font-size:12px;padding:7px 10px}
.empty{text-align:center;color:#8793ae;padding:45px 15px}
@media(max-width:750px){.sidebar{width:65px;padding:20px 7px}.logo{font-size:0;margin:0 0 25px}.logo:after{content:"N";font-size:22px}.nav a{font-size:0;text-align:center}.nav a:first-letter{font-size:17px}main{padding:22px 14px}.stats{grid-template-columns:1fr}.header h1{font-size:25px}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">NEXORA<span> AI</span></div>
<nav class="nav">
<a href="../index.html">⌂ Home</a>
<a href="dashboard.html">▦ Dashboard</a>
<a href="command-center.html">⌘ Command Center</a>
<a href="workforce.html">♟ Workforce</a>
<a href="agent-studio.html">✧ Agent Studio</a>
<a href="agent-marketplace.html">▤ Marketplace</a>
<a class="active" href="missions.html">◎ Missions</a>
<a href="task-manager.html">☷ Task Manager</a>
<a href="projects.html">▣ Projects</a>
<a href="workflow-studio.html">◇ Workflow Studio</a>
</nav>
</aside>

<main>
<div class="header">
<div>
<h1>Mission Control</h1>
<p class="subtitle">Monitor and manage your AI workforce missions.</p>
</div>
<button onclick="location.href='command-center.html'">+ Create Mission</button>
</div>

<section class="stats">
<div class="stat"><small>Total Missions</small><strong id="total">0</strong></div>
<div class="stat"><small>In Progress</small><strong id="progress">0</strong></div>
<div class="stat"><small>Completed</small><strong id="completed">0</strong></div>
</section>

<div class="toolbar">
<input id="search" placeholder="Search missions..." oninput="render()">
<select id="filter" onchange="render()">
<option value="all">All Missions</option>
<option value="Pending">Pending</option>
<option value="In Progress">In Progress</option>
<option value="Completed">Completed</option>
</select>
</div>

<section id="missionList"></section>
</main>
</div>

<script>
const STORAGE_KEY = "nexoraMissions";

function getMissions(){
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveMissions(items){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function render(){
  const missions = getMissions();
  const search = document.getElementById("search").value.toLowerCase();
  const filter = document.getElementById("filter").value;

  document.getElementById("total").textContent = missions.length;
  document.getElementById("progress").textContent =
    missions.filter(m => m.status === "In Progress").length;
  document.getElementById("completed").textContent =
    missions.filter(m => m.status === "Completed").length;

  const filtered = missions.filter(m => {
    const matchesSearch = (m.task || "").toLowerCase().includes(search);
    const matchesFilter = filter === "all" || (m.status || "Pending") === filter;
    return matchesSearch && matchesFilter;
  });

  const list = document.getElementById("missionList");

  if(!filtered.length){
    list.innerHTML = '<div class="panel empty">No missions found. Create your first mission in Command Center.</div>';
    return;
  }

  list.innerHTML = filtered.map(m => {
    const index = missions.indexOf(m);
    const status = m.status || "Pending";
    const agents = Array.isArray(m.agents) ? m.agents.join(", ") : (m.agents || "Not specified");

    return `
      <article class="mission">
        <div class="mission-top">
          <div>
            <h3>${escapeHTML(m.task || "Untitled Mission")}</h3>
            <div class="meta">
              Specialists: ${escapeHTML(agents)}<br>
              Priority: ${escapeHTML(m.priority || "Normal")} ·
              Type: ${escapeHTML(m.type || "General")}<br>
              Created: ${escapeHTML(m.date || "Date unavailable")}
            </div>
          </div>
          <span class="status">${escapeHTML(status)}</span>
        </div>
        <div class="actions">
          <button onclick="updateStatus(${index},'In Progress')">Start</button>
          <button onclick="updateStatus(${index},'Completed')">Complete</button>
          <button onclick="updateStatus(${index},'Pending')">Reset</button>
          <button onclick="deleteMission(${index})">Delete</button>
        </div>
      </article>`;
  }).join("");
}

function updateStatus(index,status){
  const missions = getMissions();
  if(!missions[index]) return;
  missions[index].status = status;
  saveMissions(missions);
  render();
}

function deleteMission(index){
  if(!confirm("Delete this mission?")) return;
  const missions = getMissions();
  missions.splice(index,1);
  saveMissions(missions);
  render();
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[char]);
}

render();
</script>
</body>
</html>
