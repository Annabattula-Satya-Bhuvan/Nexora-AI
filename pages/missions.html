<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI | Mission Control</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#080d1b;color:#eef2ff;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:245px;background:#0d1528;border-right:1px solid #202c46;padding:28px 17px;flex-shrink:0}
.logo{font-size:22px;font-weight:800;margin-bottom:38px;color:#fff}
.logo span{color:#8b7cff}
.nav-label{font-size:10px;letter-spacing:2px;color:#697895;margin:22px 10px 10px}
.nav a{display:block;text-decoration:none;color:#9eabc5;padding:12px;border-radius:9px;font-size:13px;margin:4px 0}
.nav a:hover,.nav a.active{background:#202b49;color:#fff}
main{flex:1;padding:38px;min-width:0}
.header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px;flex-wrap:wrap}
h1{font-size:30px}
.subtitle{color:#8997b4;font-size:14px;margin-top:8px}
button{border:0;border-radius:8px;padding:11px 16px;background:#7164ed;color:white;font-weight:700;cursor:pointer}
button:hover{background:#887cff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
.stat,.panel,.mission{background:#101a30;border:1px solid #24314e;border-radius:13px;padding:19px}
.stat small{color:#91a0bd}
.stat strong{display:block;font-size:28px;margin-top:9px}
.toolbar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
input,select{background:#101a30;border:1px solid #2b3a5a;color:white;border-radius:8px;padding:12px}
input{flex:1;min-width:180px}
select{min-width:150px}
.mission{margin-bottom:13px}
.mission-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.mission h3{font-size:16px}
.mission p{font-size:13px;color:#94a1bb;line-height:1.6;margin-top:9px}
.status{font-size:11px;padding:6px 10px;border-radius:20px;background:#27344e;color:#c4d2f4}
.status.progress{background:#253b62;color:#9dc5ff}
.status.completed{background:#173e37;color:#83e4c2}
.status.pending{background:#47371f;color:#f4cb85}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.actions button{font-size:11px;padding:8px 11px;background:#263654}
.actions button.delete{background:#472535}
.empty{text-align:center;color:#8997b4;padding:45px 15px}
@media(max-width:750px){
.sidebar{width:65px;padding:20px 7px}
.logo{font-size:0;margin-bottom:25px}
.logo:after{content:"N";font-size:22px}
.nav-label{display:none}
.nav a{font-size:0;text-align:center;padding:13px 5px}
.nav a:first-letter{font-size:17px}
main{padding:22px 14px}
.stats{grid-template-columns:1fr}
h1{font-size:25px}
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">NEXORA<span> AI</span></div>
<nav class="nav">
<a href="../index.html">⌂ Home</a>
<a href="dashboard.html">▦ Dashboard</a>
<a href="command-center.html">⌘ Command Center</a>
<a href="workforce.html">♟ Workforce</a>
<a href="agent-studio.html">✧ Agent Studio</a>
<a href="agent-marketplace.html">▤ Marketplace</a>
<a class="active" href="missions.html">◎ Missions</a>
<a href="task-manager.html">☷ Task Manager</a>
<a href="projects.html">▣ Projects</a>
<a href="workflow-studio.html">◇ Workflow Studio</a>
</nav>
</aside>

<main>
<div class="header">
<div>
<h1>Mission Control</h1>
<p class="subtitle">Monitor and manage your AI workforce missions.</p>
</div>
<button onclick="location.href='command-center.html'">+ Create Mission</button>
</div>

<section class="stats">
<div class="stat"><small>Total Missions</small><strong id="total">0</strong></div>
<div class="stat"><small>In Progress</small><strong id="progress">0</strong></div>
<div class="stat"><small>Completed</small><strong id="completed">0</strong></div>
</section>

<div class="toolbar">
<input id="search" placeholder="Search missions..." oninput="render()">
<select id="filter" onchange="render()">
<option value="all">All Missions</option>
<option value="Pending">Pending</option>
<option value="In Progress">In Progress</option>
<option value="Completed">Completed</option>
</select>
</div>

<section id="missionList"></section>
</main>
</div>

<script>
const STORAGE_KEY = "nexoraMissions";

function getMissions(){
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveMissions(items){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function render(){
  const missions = getMissions();
  const search = document.getElementById("search").value.toLowerCase();
  const filter = document.getElementById("filter").value;

  document.getElementById("total").textContent = missions.length;
  document.getElementById("progress").textContent =
    missions.filter(m => m.status === "In Progress").length;
  document.getElementById("completed").textContent =
    missions.filter(m => m.status === "Completed").length;

  const filtered = missions.filter(m => {
    const matchesSearch = (m.task || "").toLowerCase().includes(search);
    const matchesFilter = filter === "all" || (m.status || "Pending") === filter;
    return matchesSearch && matchesFilter;
  });

  const list = document.getElementById("missionList");
  list.replaceChildren();

  if(!filtered.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = missions.length
      ? "No missions match your search."
      : "No missions yet. Create your first mission from Command Center.";
    list.append(empty);
    return;
  }

  filtered.forEach(mission => {
    const card = document.createElement("article");
    card.className = "mission";

    const top = document.createElement("div");
    top.className = "mission-top";

    const title = document.createElement("h3");
    title.textContent = mission.task || "Untitled Mission";

    const status = document.createElement("span");
    status.className = "status " +
      (mission.status === "Completed" ? "completed" :
      mission.status === "In Progress" ? "progress" : "pending");
    status.textContent = mission.status || "Pending";

    top.append(title, status);

    const description = document.createElement("p");
    description.textContent =
      mission.description || "Mission created through NEXORA AI Command Center.";

    const actions = document.createElement("div");
    actions.className = "actions";

    const nextStatus =
      mission.status === "Pending" ? "In Progress" :
      mission.status === "In Progress" ? "Completed" : "Pending";

    const updateButton = document.createElement("button");
    updateButton.textContent = "Mark " + nextStatus;
    updateButton.addEventListener("click", () => {
      updateMission(mission.id, nextStatus);
    });

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "Delete";
    deleteButton.addEventListener("click", () => {
      deleteMission(mission.id);
    });

    actions.append(updateButton, deleteButton);
    card.append(top, description, actions);
    list.append(card);
  });
}

function updateMission(id, status){
  const missions = getMissions();
  const updated = missions.map(m =>
    String(m.id) === String(id) ? {...m, status} : m
  );
  saveMissions(updated);
  render();
}

function deleteMission(id){
  if(!confirm("Delete this mission?")) return;

  const missions = getMissions().filter(m =>
    String(m.id) !== String(id)
  );

  saveMissions(missions);
  render();
}
render();
</script>
</body>
</html>
