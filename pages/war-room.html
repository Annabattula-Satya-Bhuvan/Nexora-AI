<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA | AI War Room</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b16;color:#eef0ff;font-family:Arial,sans-serif;display:flex;min-height:100vh}
aside{width:230px;background:#101326;padding:25px 17px;border-right:1px solid #252943;flex-shrink:0}
.logo{font-size:21px;font-weight:bold;color:#a78bfa;margin-bottom:35px}nav a{display:block;color:#aeb4d0;text-decoration:none;padding:11px;border-radius:9px;margin:4px 0;font-size:13px}nav a:hover,nav a.active{background:#28234a;color:white}
main{padding:35px;width:100%;max-width:1250px;margin:auto}h1{margin:0 0 8px}.muted{color:#9299b8;font-size:13px}
.card{background:#12162a;border:1px solid #292e4d;border-radius:14px;padding:20px;margin-top:20px}
input,textarea,select{background:#0b0e1d;color:white;border:1px solid #303653;border-radius:8px;padding:12px;margin:5px 0;width:100%}textarea{min-height:100px}
button{background:linear-gradient(120deg,#6655df,#9333ea);color:white;border:0;padding:11px 16px;border-radius:8px;cursor:pointer}
.message{padding:15px;margin:12px 0;background:#0d1122;border:1px solid #292e4d;border-radius:10px}
.tag{color:#a78bfa;font-size:12px;font-weight:bold}.time{color:#777f9e;font-size:11px}
@media(max-width:750px){aside{width:65px;padding:15px 5px}aside .logo{font-size:12px}nav a{font-size:0}main{padding:18px}}
</style>
</head>
<body>
<aside><div class="logo">✦ NEXORA</div><nav>
<a href="../index.html">Dashboard</a><a href="missions.html">Missions</a><a href="task-manager.html">Task Manager</a><a href="projects.html">Projects</a><a href="workflow-studio.html">Workflow Studio</a><a href="war-room.html" class="active">AI War Room</a><a href="verification-center.html">Verification</a><a href="user-management.html">User Management</a><a href="security.html">Security</a>
</nav></aside>
<main>
<h1>AI War Room</h1>
<p class="muted">A collaborative workspace for planning, discussion and decision tracking.</p>
<div class="card">
<h3>Start a Discussion</h3>
<input id="topic" placeholder="Discussion topic or mission">
<textarea id="message" placeholder="Describe the challenge or share an update..."></textarea>
<select id="agent"><option>Human Coordinator</option><option>Research Agent</option><option>Planning Agent</option><option>Coding Agent</option><option>Design Agent</option><option>Fact-checking Agent</option></select>
<button onclick="post()">Post Contribution</button>
</div>
<div class="card">
<h3>Discussion Timeline</h3>
<div id="feed"></div>
</div>
</main>
<script>
const key="nexoraWarRoom";
let posts=JSON.parse(localStorage.getItem(key)||"null")||[
{id:1,topic:"Welcome to the NEXORA War Room",agent:"Human Coordinator",message:"Use this space to record ideas, agent contributions and team decisions.",time:new Date().toISOString()}
];
function save(){localStorage.setItem(key,JSON.stringify(posts));render()}
function post(){
let topic=document.getElementById("topic").value.trim(),message=document.getElementById("message").value.trim();
if(!topic||!message)return alert("Enter a topic and contribution.");
posts.unshift({id:Date.now(),topic,agent:document.getElementById("agent").value,message,time:new Date().toISOString()});
document.getElementById("topic").value="";document.getElementById("message").value="";save();
}
function removePost(id){if(confirm("Delete this contribution?")){posts=posts.filter(p=>p.id!==id);save()}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
document.getElementById("feed").innerHTML=posts.map(p=>`<div class="message"><div class="tag">${esc(p.agent)}</div><h3>${esc(p.topic)}</h3><p>${esc(p.message).replace(/\n/g,"<br>")}</p><span class="time">${new Date(p.time).toLocaleString()}</span><br><br><button style="background:#702d48" onclick="removePost(${p.id})">Delete</button></div>`).join("");
}
render();
</script>
</body>
</html>
