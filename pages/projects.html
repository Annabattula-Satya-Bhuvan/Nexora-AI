<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI | Project Workspace</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial,sans-serif;background:#080d1b;color:#eef2ff;min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:245px;background:#0d1528;border-right:1px solid #202c46;padding:28px 17px;flex-shrink:0}
.logo{font-size:22px;font-weight:800;margin-bottom:38px;color:#fff}
.logo span{color:#8b7cff}
.nav-label{font-size:10px;letter-spacing:2px;color:#697895;margin:22px 10px 10px}
.nav a{display:block;text-decoration:none;color:#9eabc5;padding:12px;border-radius:9px;font-size:13px;margin:4px 0}
.nav a:hover,.nav a.active{background:#202b49;color:#fff}
main{flex:1;padding:38px;min-width:0}
.header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px;flex-wrap:wrap}
h1{font-size:30px}
.subtitle{color:#8997b4;font-size:14px;margin-top:8px}
button{border:0;border-radius:8px;padding:10px 14px;background:#7164ed;color:white;font-weight:700;cursor:pointer}
button:hover{background:#887cff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:25px}
.stat,.project{background:#101a30;border:1px solid #24314e;border-radius:13px;padding:19px}
.stat small{color:#91a0bd}
.stat strong{display:block;font-size:28px;margin-top:9px}
.toolbar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
input,select,textarea{background:#101a30;border:1px solid #2b3a5a;color:white;border-radius:8px;padding:12px;width:100%;font:inherit}
.toolbar input{flex:1;min-width:180px}
.toolbar select{width:auto;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}
.project{min-width:0}
.project-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.project h3{font-size:17px;overflow-wrap:anywhere}
.project p{font-size:13px;color:#94a1bb;line-height:1.6;margin-top:10px}
.status{font-size:11px;padding:6px 10px;border-radius:20px;background:#27344e;color:#c4d2f4;white-space:nowrap}
.status.active{background:#253b62;color:#9dc5ff}
.status.completed{background:#173e37;color:#83e4c2}
.progress-track{height:7px;background:#26334d;border-radius:20px;margin-top:17px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#7164ed,#37c8e8);border-radius:20px}
.progress-label{display:flex;justify-content:space-between;color:#91a0bd;font-size:11px;margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions button{font-size:11px;padding:8px 11px;background:#263654}
.actions button.delete{background:#472535}
.empty{text-align:center;color:#8997b4;padding:45px 15px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal-box{width:100%;max-width:460px;background:#111a2e;border:1px solid #304064;border-radius:15px;padding:24px;max-height:90vh;overflow-y:auto}
.modal-box h2{margin-bottom:18px}
.modal-box label{display:block;font-size:12px;color:#aebbd3;margin:14px 0 7px}
.modal-box textarea{min-height:85px;resize:vertical}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.secondary{background:#26324c}
@media(max-width:750px){
.sidebar{width:65px;padding:20px 7px}
.logo{font-size:0;margin-bottom:25px}
.logo:after{content:"N";font-size:22px}
.nav-label{display:none}
.nav a{font-size:0;text-align:center;padding:13px 5px}
.nav a:first-letter{font-size:17px}
main{padding:22px 14px}
.stats{grid-template-columns:1fr}
h1{font-size:25px}
}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
<div class="logo">NEXORA<span> AI</span></div>
<nav class="nav">
<a href="../index.html">⌂ Home</a>
<a href="dashboard.html">▦ Dashboard</a>
<a href="command-center.html">⌘ Command Center</a>
<a href="workforce.html">♟ Workforce</a>
<a href="agent-studio.html">✧ Agent Studio</a>
<a href="agent-marketplace.html">▤ Marketplace</a>
<a href="missions.html">◎ Missions</a>
<a href="task-manager.html">☷ Task Manager</a>
<a class="active" href="projects.html">▣ Projects</a>
<a href="workflow-studio.html">◇ Workflow Studio</a>
</nav>
</aside>

<main>
<div class="header">
<div>
<h1>Project Workspace</h1>
<p class="subtitle">Organize your projects, track progress and manage objectives.</p>
</div>
<button onclick="openModal()">+ New Project</button>
</div>

<section class="stats">
<div class="stat"><small>Total Projects</small><strong id="total">0</strong></div>
<div class="stat"><small>Active Projects</small><strong id="active">0</strong></div>
<div class="stat"><small>Completed Projects</small><strong id="completed">0</strong></div>
</section>

<div class="toolbar">
<input id="search" placeholder="Search projects..." oninput="render()">
<select id="filter" onchange="render()">
<option value="all">All Projects</option>
<option value="Planning">Planning</option>
<option value="Active">Active</option>
<option value="Completed">Completed</option>
</select>
</div>

<section class="grid" id="projectList"></section>
</main>
</div>

<div class="modal" id="projectModal">
<div class="modal-box">
<h2>Create New Project</h2>
<form id="projectForm">
<label for="projectName">Project Name</label>
<input id="projectName" maxlength="100" placeholder="Enter project name" required>

<label for="projectDescription">Description</label>
<textarea id="projectDescription" maxlength="500" placeholder="What is this project about?"></textarea>

<label for="projectStatus">Project Status</label>
<select id="projectStatus">
<option>Planning</option>
<option>Active</option>
<option>Completed</option>
</select>

<div class="modal-actions">
<button type="button" class="secondary" onclick="closeModal()">Cancel</button>
<button type="submit">Create Project</button>
</div>
</form>
</div>
</div>

<script>
const STORAGE_KEY = "nexoraProjects";

function getProjects(){
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch {
    return [];
  }
}

function saveProjects(projects){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
}

function openModal(){
  document.getElementById("projectModal").classList.add("open");
  document.getElementById("projectName").focus();
}

function closeModal(){
  document.getElementById("projectModal").classList.remove("open");
}

document.getElementById("projectForm").addEventListener("submit", function(e){
  e.preventDefault();

  const name = document.getElementById("projectName").value.trim();
  const description = document.getElementById("projectDescription").value.trim();
  const status = document.getElementById("projectStatus").value;

  if(!name) return;

  const projects = getProjects();

  projects.unshift({
    id: Date.now().toString(),
    name,
    description,
    status,
    progress: status === "Completed" ? 100 : 0,
    created: new Date().toLocaleDateString()
  });

  saveProjects(projects);
  this.reset();
  closeModal();
  render();
});

function updateStatus(id, status){
  const projects = getProjects().map(project => {
    if(String(project.id) !== String(id)) return project;

    return {
      ...project,
      status,
      progress: status === "Completed" ? 100 : project.progress
    };
  });

  saveProjects(projects);
  render();
}

function updateProgress(id){
  const projects = getProjects();
  const project = projects.find(p => String(p.id) === String(id));

  if(!project) return;

  const value = prompt("Enter project progress (0–100):", project.progress || 0);

  if(value === null) return;

  const progress = Number(value);

  if(!Number.isInteger(progress) || progress < 0 || progress > 100){
    alert("Enter a whole number between 0 and 100.");
    return;
  }

  project.progress = progress;

  if(progress === 100){
    project.status = "Completed";
  } else if(project.status === "Completed"){
    project.status = "Active";
  }

  saveProjects(projects);
  render();
}

function deleteProject(id){
  if(!confirm("Delete this project?")) return;

  saveProjects(getProjects().filter(p =>
    String(p.id) !== String(id)
  ));

  render();
}

function render(){
  const projects = getProjects();
  const search = document.getElementById("search").value.toLowerCase();
  const filter = document.getElementById("filter").value;

  document.getElementById("total").textContent = projects.length;
  document.getElementById("active").textContent =
    projects.filter(p => p.status === "Active").length;
  document.getElementById("completed").textContent =
    projects.filter(p => p.status === "Completed").length;

  const filtered = projects.filter(project => {
    const matchesSearch =
      (project.name || "").toLowerCase().includes(search) ||
      (project.description || "").toLowerCase().includes(search);

    const matchesFilter =
      filter === "all" || project.status === filter;

    return matchesSearch && matchesFilter;
  });

  const list = document.getElementById("projectList");
  list.replaceChildren();

  if(!filtered.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = projects.length
      ? "No projects match your search."
      : "No projects yet. Create your first project.";
    list.append(empty);
    return;
  }

  filtered.forEach(project => {
    const card = document.createElement("article");
    card.className = "project";

    const top = document.createElement("div");
    top.className = "project-top";

    const title = document.createElement("h3");
    title.textContent = project.name;

    const status = document.createElement("span");
    status.className = "status " +
      (project.status === "Completed" ? "completed" :
      project.status === "Active" ? "active" : "");
    status.textContent = project.status;

    top.append(title, status);

    const description = document.createElement("p");
    description.textContent = project.description || "No description provided.";

    const track = document.createElement("div");
    track.className = "progress-track";

    const fill = document.createElement("div");
    fill.className = "progress-fill";
    fill.style.width = Math.max(0, Math.min(100, Number(project.progress) || 0)) + "%";
    track.append(fill);

    const label = document.createElement("div");
    label.className = "progress-label";

    const progressText = document.createElement("span");
    progressText.textContent = "Project progress";

    const progressValue = document.createElement("span");
    progressValue.textContent = (Number(project.progress) || 0) + "%";

    label.append(progressText, progressValue);

    const created = document.createElement("p");
    created.textContent = "Created: " + project.created;

    const actions = document.createElement("div");
    actions.className = "actions";

    const progressButton = document.createElement("button");
    progressButton.textContent = "Update Progress";
    progressButton.addEventListener("click", () => updateProgress(project.id));

    const statusButton = document.createElement("button");
    statusButton.textContent =
      project.status === "Active" ? "Mark Completed" : "Set Active";
    statusButton.addEventListener("click", () => {
      updateStatus(
        project.id,
        project.status === "Active" ? "Completed" : "Active"
      );
    });

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "Delete";
    deleteButton.addEventListener("click", () => deleteProject(project.id));

    actions.append(progressButton, statusButton, deleteButton);
    card.append(top, description, track, label, created, actions);
    list.append(card);
  });
}

document.getElementById("projectModal").addEventListener("click", function(e){
  if(e.target === this) closeModal();
});

render();
</script>
</body>
</html>
